<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0D0E11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kopi" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Kopi</title>
    <script>
      // Paint the saved colour scheme before React loads (avoids a flash of the default theme).
      (function () {
        try {
          var raw = localStorage.getItem('actual_companion_appearance_v1');
          if (!raw) return;
          var saved = JSON.parse(raw);
          var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var tokens = saved.follow && light ? saved.day : saved.primary;
          if (!tokens) return;
          var root = document.documentElement;
          for (var k in tokens) root.style.setProperty(k, tokens[k]);
          root.style.colorScheme = tokens['--color-scheme'] || 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', tokens['--bg-canvas']);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
